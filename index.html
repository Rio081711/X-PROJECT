<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Krish</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
           background-image: url('background 2.png');
           background-size: cover;
           background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 400px;
            height: 500px;
            background: #fb21ab;
            position: absolute;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
            border-radius: 15px;
            box-shadow: 0 25px 35px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .title {
            text-align: center;
             text-shadow: 1px 1px 20px rgb(164, 21, 147);
            margin-top: 30px;
            color: #f3d4e2;
            font-size: 48px;
            font-weight: bold;
            font-family: rage;
        }

        .subtitle {
            text-align: center;
            color: #fae5f4;
            font-size: 16px;
            margin-top: 5px;
        }

        .cake {
            width: 100%;
            height: 300px;
            position: absolute;
            bottom: 35px;
        }

        .top-layer,
        .middle-layer,
        .bottom-layer {
            height: 70px;
            position: absolute;
            margin: auto;
            left: 0;
            right: 0;
            background-repeat: repeat;
            background-size: 100% 100%, 60px 100px;
            background-position: 28px 0;
            background-image:
                linear-gradient(
                    transparent 40px,
                    #e3a 40px,
                    #e3a 50px,
                    transparent 50px
                ),
                radial-gradient(
                    circle at 30px 5px,
                    pink 30px,
                    lightpink 31px
                );
            border-radius: 5px;
        }

        .bottom-layer {
            width: 280px;
            bottom: 20px;
        }

        .middle-layer {
            width: 250px;
            bottom: 90px;
            transform: scale(0.85);
            animation: rise-middle 1s 1s forwards;
        }

        @keyframes rise-middle {
            from {
                bottom: 20px;
                opacity: 0;
            }

            to {
                bottom: 90px;
                opacity: 1;
            }
        }

        .top-layer {
            width: 220px;
            bottom: 160px;
            transform: scale(0.7);
            animation: rise-top 1s 2s forwards;
        }

        @keyframes rise-top {
            from {
                bottom: 90px;
                opacity: 0;
            }

            to {
                bottom: 160px;
                opacity: 1;
            }
        }

        .candle {
            background: repeating-linear-gradient(
                45deg,
                red 0,
                red 5px,
                pink 5px,
                pink 10px
            );

            height: 45px;
            width: 15px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 230px;
            border-radius: 3px;
            animation: candle-rise 1s 3s forwards;
            opacity: 0;
        }

        @keyframes candle-rise {
            from {
                bottom: 160px;
                opacity: 0;
            }

            to {
                bottom: 230px;
                opacity: 1;
            }
        }

        .candle::after {
            content: '';
            position: absolute;
            height: 18px;
            width: 18px;
            background-color: #ffd700;
            border-radius: 0 50% 50% 50%;
            transform: scale(0) rotate(45deg);
            bottom: 45px;
            left: -1.5px;

            animation: flame 1s 4s forwards;
        }

        @keyframes flame {
            0% {
                transform: scale(0) rotate(45deg);
            }

            100% {
                transform: scale(1) rotate(45deg);
            }
        }

        .candle::before {
            content: '';
            position: absolute;
            height: 25px;
            width: 25px;
            background: rgba(255, 200, 0, 0.25);
            border-radius: 50%;
            top: -17px;
            left: -5px;
            opacity: 0;

            animation: glow 1s 4.5s infinite alternate;
        }

        @keyframes glow {
            from {
                opacity: 0.3;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .message {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: #e83e8c;
            font-size: 18px;
            font-weight: bold;
        }

        .img1{
            height: 400px;
            width: 250px;
            border-radius: 10px;
            background-color: #e83e8c;
            border: 2px solid gray;
            transform: rotate(-20deg);
            position: absolute;
            top: 5%;
            left: 8%;
        }

        .img2{
            height: 400px;
            width: 250px;
            border-radius: 10px;
             background-size: cover;
            border: 2px solid gray;
            transform: rotate(20deg);
            position: absolute;
            top: 28%;
            left: 12%;
        }

        .img3{
            height: 400px;
            width: 250px;
            border-radius: 10px;
            background-size: cover;
            border: 2px solid gray;
            transform: rotate(-20deg);
            position: absolute;
            top: 50%;
            left: 15%;
        }

        .img4{
            height: 400px;
            width: 250px;
            border-radius: 10px;
            background-size: cover;
            border: 2px solid gray;
            transform: rotate(20deg);
            position: absolute;
            top: 5%;
            right: 8%;
        }

        .img5{
            height: 400px;
            width: 250px;
            border-radius: 10px;
            background-size: cover;
            border: 2px solid gray;
            transform: rotate(-20deg);
            position: absolute;
            top: 28%;
            right: 12%;
        }

        .img6{
            height: 400px;
            width: 250px;
            border-radius: 10px;
          background-size: cover;
            border: 2px solid gray;
            transform: rotate(20deg);
            position: absolute;
            top: 50%;
            right: 15%;
        }

        a {
            position: absolute;
            bottom: 60px;
            left: 47%;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e83e8c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }


        @media (max-width: 450px) {
            .container {
                width: 90%;
                margin: auto;
            }

            .img1, .img2, .img3, .img4, .img5, .img6 {
                width: 100px;
                height: 200px;
                margin: auto;
            }
        }
    </style>
</head>

<body>

     <div class="title">
            🎂 Happy Birthday ADI! 🎉
        </div>

        

          <div class="message">
            💖 Have an amazing birthday! 💖
        </div>

    <div class="container">

        <div class="cake">

            <div class="top-layer"></div>

            <div class="middle-layer"></div>

            <div class="bottom-layer"></div>

            <div class="candle"></div>

        </div>

    </div>

    <img src="1.jpg" alt="" class="img1">
    <img src="2.jpg" alt="" class="img2">
    <img src="3.jpg" alt="" class="img3">
    <img src="4.jpg" alt="" class="img4">
    <img src="5.jpg" alt="" class="img5">
    <img src="6.jpg" alt="" class="img6">

    <a href="letter.html" class="open-letter">
        Open Letter
    </a>

        💖 Have an amazing birthday! 💖
    </p> 


</body>
</html>
